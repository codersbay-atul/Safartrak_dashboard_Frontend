name: Deploy React App to AWS EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Clean npm cache
        run: |
          npm cache clean --force

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional
          npm install @rolldown/binding-linux-x64-gnu --save-dev

      - name: Verify Rolldown binding
        run: |
          npm ls rolldown
          npm ls @rolldown/binding-linux-x64-gnu

      - name: Build React App
        run: npm run build

      - name: Deploy to AWS EC2 via rsync
        env:
          HOST: ${{ secrets.HOST_MAIN }}
          USER: ${{ secrets.NEW_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "$SSH_KEY" > deploy-key.pem
          chmod 400 deploy-key.pem

          sudo apt-get update -y
          sudo apt-get install -y rsync

          ssh -o StrictHostKeyChecking=no -i deploy-key.pem $USER@$HOST \
            "sudo mkdir -p /var/www/html && sudo chown -R $USER:$USER /var/www/html"

          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -i deploy-key.pem" \
            ./dist/ $USER@$HOST:/var/www/html/

          ssh -o StrictHostKeyChecking=no -i deploy-key.pem $USER@$HOST \
            "sudo systemctl restart nginx"
