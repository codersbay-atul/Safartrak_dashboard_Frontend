<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>safarTrak</title>
    <script>
      // Starts the auth hero fetch during HTML parse, before the app bundle is
      // downloaded. Skipped for signed-in users, who never see the auth screens.
      (function () {
        var AUTH_PATH =
          /^\/(login|signup|forgot-password|otp-verification|reset-password|password-updated)\/?$/;
        var signedIn = false;
        try {
          signedIn = !!localStorage.getItem("access_token");
        } catch (e) {
          /* storage blocked */
        }
        if (signedIn && !AUTH_PATH.test(location.pathname)) return;

        [
          ["(min-width: 1024px)", "/images/auth/hero-desktop.webp"],
          [
            "(min-width: 768px) and (max-width: 1023.98px)",
            "/images/auth/hero-tab.webp",
          ],
        ].forEach(function (entry) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.media = entry[0];
          link.href = entry[1];
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
